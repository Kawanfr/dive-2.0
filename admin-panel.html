<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>DIVE - Master Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.2);
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.08); }
        .tab-btn.active { background: #3498db; box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.25); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .schedule-tab-content { display: none; }
        .schedule-tab-content.active { display: block; }
        .schedule-grid { display: grid; gap: 12px; }

        .auth-container { max-width: 800px; margin: 40px auto; padding: 20px; background: #2c3e50; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #bdc3c7; font-size: 14px; }
        .auth-input { width: 100%; padding: 12px; border: 1px solid #34495e; border-radius: 8px; background: rgba(0,0,0,0.2); color: #fff; box-sizing: border-box; }
        .auth-input:focus { border-color: #3498db; outline: none; }
        .auth-input:disabled { opacity: 0.5; background: rgba(0,0,0,0.5); }
        
        .btn-panel { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-danger:hover { background: #c0392b; }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

        .list-panel { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.12); }
        .establishment-list { display: grid; gap: 12px; }
        .establishment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px 14px;
            color: #ecf0f1;
        }
        .establishment-meta { flex: 1; }
        .establishment-actions { display: flex; gap: 8px; }
        .mini-btn {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .mini-btn.edit { background: #3498db; color: white; }
        .mini-btn.delete { background: #e74c3c; color: white; }

        .time-group { display: flex; gap: 10px; }
        .time-group .auth-input { width: 50%; }

        .top-bar { display: flex; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #34495e; margin-bottom: 20px; }
    </style>
</head>
<body class="scrollable">

    <div class="auth-container">
        <div class="top-bar">
            <span>👑 <strong>Painel Master</strong></span>
            <div>
                <a href="index.html" class="secondary-btn" style="text-decoration: none; padding: 8px 12px;">🗺️ Mapa</a>
            </div>
        </div>

        <!-- ABA DE CRIAÇÃO -->
        <div id="create" class="tab-content active">
            <form id="create-form">
                <input type="hidden" id="editing-id" value="">
                <div class="form-group">
                    <label>Nome do Estabelecimento</label>
                    <input type="text" id="new-name" class="auth-input" placeholder="Ex: Supermercado Assaí" required>
                </div>
                <div class="time-group">
                    <div class="form-group" style="flex:1;">
                        <label>CEP</label>
                        <input type="text" id="new-cep" class="auth-input" placeholder="Apenas números" maxlength="9" required>
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label>Endereço Completo</label>
                        <input type="text" id="new-address" class="auth-input" placeholder="Rua, Número, Bairro, Cidade - UF" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>URL do Ícone (Logo) - Opcional</label>
                    <input type="url" id="new-icon" class="auth-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Website oficial - Opcional</label>
                    <input type="url" id="new-site" class="auth-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Texto Livre de Horário</label>
                    <input type="text" id="new-hours-text" class="auth-input" placeholder="Seg-Sáb: 07:00 - 22:00..." required>
                </div>
                <label style="color: #bdc3c7; font-size: 14px; margin-bottom: 10px; display: block;">Horário Lógico (Aberto/Fechado)</label>

                <div class="tabs" aria-label="Abas de horários" role="tablist">
                    <button type="button" class="tab-btn active" data-tab="weekdays" role="tab" aria-selected="true">Seg. a Sex.</button>
                    <button type="button" class="tab-btn" data-tab="saturday" role="tab" aria-selected="false">Sáb.</button>
                    <button type="button" class="tab-btn" data-tab="sunday" role="tab" aria-selected="false">Dom.</button>
                </div>

                <div class="schedule-grid">
                    <div class="schedule-tab-content active" id="tab-weekdays">
                        <div class="time-group">
                            <input type="number" id="weekday-open" class="auth-input" placeholder="Seg.-Sex. abre Ex: 7" min="0" max="23" required>
                            <input type="number" id="weekday-close" class="auth-input" placeholder="Seg.-Sex. fecha Ex: 22" min="0" max="23" required>
                        </div>
                    </div>

                    <div class="schedule-tab-content" id="tab-saturday">
                        <div class="time-group">
                            <input type="number" id="saturday-open" class="auth-input" placeholder="Sábado abre Ex: 8" min="0" max="23" required>
                            <input type="number" id="saturday-close" class="auth-input" placeholder="Sábado fecha Ex: 18" min="0" max="23" required>
                        </div>
                    </div>

                    <div class="schedule-tab-content" id="tab-sunday">
                        <div class="time-group">
                            <input type="number" id="sunday-open" class="auth-input" placeholder="Domingo abre Ex: 9" min="0" max="23" required>
                            <input type="number" id="sunday-close" class="auth-input" placeholder="Domingo fecha Ex: 17" min="0" max="23" required>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="primary-btn btn-panel" id="submit-button">💾 Cadastrar Loja no Mapa</button>
            </form>

            <div class="list-panel">
                <h3 style="color: #fff; margin-bottom: 12px;">Estabelecimentos Cadastrados</h3>
                <div id="establishments-list" class="establishment-list"></div>
            </div>
        </div>

    </div>

    <!-- Painel Admin JS -->
    <script type="module" src="editor.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>DIVE Master - Nova Loja</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="scrollable">

    <div class="master-nav">
        <a href="adicionar.html" class="nav-btn active">➕ Nova Loja</a>
        <a href="editar.html" class="nav-btn">✏️ Editar Loja</a>
        <a href="cadastro.html" class="nav-btn outline">⚙️ Painel de Gerentes</a>
        <a href="#" id="logout-btn" class="nav-btn outline" style="border-color: #e74c3c; color: #e74c3c;">🚪 Sair</a>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <h1>DIVE Master 👑</h1>
            <p>Cadastre uma nova loja permanentemente no mapa.</p>
        </div>

        <form id="master-form">
            <div class="form-group">
                <label>Nome Oficial da Loja</label>
                <input type="text" id="new-name" required placeholder="Ex: Supermercado Extra" maxlength="30">
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Latitude (Lat)</label>
                    <input type="number" step="any" id="new-lat" required placeholder="-23.646234">
                </div>
                <div style="flex: 1;">
                    <label>Longitude (Lng)</label>
                    <input type="number" step="any" id="new-lng" required placeholder="-46.729094">
                </div>
            </div>

            <div class="form-group">
                <label>URL do Ícone (Logo da loja - opcional)</label>
                <input type="url" id="new-icon"
                    placeholder="https://www.google.com/s2/favicons?domain=extra.com.br&sz=128" maxlength="120">
            </div>

            <div class="form-group">
                <label>Site / Rede Social (Opcional)</label>
                <input type="url" id="new-site" placeholder="https://www.extra.com.br" maxlength="120">
            </div>

            <div class="form-group">
                <label>Texto de Horários Físicos (Para os popups)</label>
                <input type="text" id="new-hours-text" required
                    placeholder="Ex: 08:00-22:00" maxlength="15">
            </div>

            <div class="admin-header" style="text-align: left; margin-bottom: 15px; margin-top: 25px;">
                <h3>🕗 Horários Automáticos do Sistema</h3>
                <p style="font-size: 13px; margin: 0; line-height: 1.2;">
                    Digite apenas as horas cheias para ativar a plaqueta "Aberto Agora" no mapa. Exato formato inteiro
                    de relógio 24h.
                </p>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Seg a Sáb (Abre)</label>
                    <input type="number" id="week-open" required placeholder="7" min="0" max="24">
                </div>
                <div style="flex: 1;">
                    <label>Seg a Sáb (Fecha)</label>
                    <input type="number" id="week-close" required placeholder="22" min="0" max="24">
                </div>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Domingos (Abre)</label>
                    <input type="number" id="sun-open" required placeholder="8" min="0" max="24">
                </div>
                <div style="flex: 1;">
                    <label>Domingos (Fecha)</label>
                    <input type="number" id="sun-close" required placeholder="18" min="0" max="24">
                </div>
            </div>

            <button type="submit" class="primary-btn" style="margin-top: 15px;">💾 Cadastrar Loja no Mapa</button>
        </form>
    </div>

    <script type="module" src="adicionar.js"></script>
</body>

</html>

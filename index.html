<!DOCTYPE html>
<html lang="pt-BR">
    <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <meta name="theme-color" content="#2c3e50">
         <meta name="description" content="Mapa interativo do DIVE 2.0 com busca por locais, filtros e notificações em tempo real.">
         <meta name="apple-mobile-web-app-capable" content="yes">
         <title>Dive 2.0</title>

         <!-- Leaflet CSS -->
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

          <!-- Leaflet MarkerCluster CSS -->
          <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
          <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

          <!-- Para o CSS -->
        <link rel="stylesheet" href="style.css">
          <link rel="stylesheet" href="map-panel.css">

           <!-- Manifesto PWA -->
        <link rel="manifest" href="manifest.json">
    </head>

        <body>
            <!-- Filtros Superiores -->
            <div id="filter-container" aria-label="Filtros do mapa">
                <input type="text" id="search-input" aria-label="Buscar local" placeholder="🔍 Buscar local...">
                <select id="radius-filter" aria-label="Filtrar por raio">
                    <option value="all">🌐 Tudo</option>
                    <option value="1000">1 km</option>
                    <option value="3000">3 km</option>
                    <option value="5000">5 km</option>
                </select>
                <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">Todos</button>
                <button class="filter-btn" type="button" data-filter="agitado" aria-pressed="false">🔥 Agitado</button>
                <button class="filter-btn" type="button" data-filter="tranquilo" aria-pressed="false">🧊 Tranquilo</button>
                <button class="filter-btn" type="button" data-filter="promocoes" aria-pressed="false">🏷️ Promoções</button>
            </div>

            <!-- Container de Notificações Visuais -->
            <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

            <!-- Container do Mapa -->
             <div id="map" aria-label="Mapa interativo"></div>

            <section id="place-panel" class="place-panel" aria-label="Detalhes da loja selecionada" aria-hidden="true">
                <div class="place-panel-handle" aria-hidden="true"></div>
                <button id="place-panel-close" class="place-panel-close" type="button" aria-label="Fechar detalhes da loja">×</button>
                <div id="place-panel-content"></div>
            </section>

             <!-- Botão de Centralizar -->
             <button id="center-btn" type="button" aria-label="Centralizar mapa">📍</button>

             <!-- Botão de Ativar Notificações -->
             <button id="notif-btn" class="hidden" type="button" aria-label="Ativar notificações" aria-pressed="false">🔕</button>

        <!-- Botão de Instalação PWA -->
        <button id="install-pwa-btn" class="hidden" type="button" aria-label="Instalar aplicativo">📲 Instalar App</button>

             <!-- Leaflet JS -->
              <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
              integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
              crossorigin=""></script>

              <!-- Leaflet MarkerCluster JS -->
              <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

              <!-- Nossa Lógica -->

               <script type="module" src="app.js?v=52"></script>
            
        </body>
</html>

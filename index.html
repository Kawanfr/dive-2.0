<!DOCTYPE html>
<html lang="pt-BR">
    <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device=width, initial=scale=1.0, maximum-scale=1.0, user-scalable=no">
         <meta name="theme-color" content="#2c3e50">
         <title>Dive 2.0</title>

         <!-- Leaflet CSS -->
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

          <!-- Leaflet MarkerCluster CSS -->
          <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
          <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

          <!-- Para o CSS -->
        <link rel="stylesheet" href="style.css">

           <!-- Manifesto PWA -->
        <link rel="manifest" href="manifest.json">
    </head>

        <body>
            <!-- Filtros Superiores -->
            <div id="filter-container">
                <input type="text" id="search-input" placeholder="🔍 Buscar local...">
                <select id="radius-filter">
                    <option value="all">🌐 Tudo</option>
                    <option value="1000">1 km</option>
                    <option value="3000">3 km</option>
                    <option value="5000">5 km</option>
                </select>
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="agitado">🔥 Agitado</button>
                <button class="filter-btn" data-filter="tranquilo">🧊 Tranquilo</button>
            </div>

            <!-- Container de Notificações Visuais -->
            <div id="toast-container"></div>

            <!-- Container do Mapa -->
             <div id="map"></div>

             <!-- Botão de Centralizar -->
             <button id="center-btn">📍</button>

             <!-- Botão de Ativar Notificações -->
             <button id="notif-btn" class="hidden">🔕</button>

             <!-- Leaflet JS -->
              <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
              integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
              crossorigin=""></script>

              <!-- Leaflet MarkerCluster JS -->
              <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

              <!-- Mossa Lógica -->
               <script src="app.js?v=24"></script>
            
        </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>Ofertas da Comunidade - DIVE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        .offers-list { margin-top: 15px; }
        .offer-item { background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; justify-content: center; border-left: 4px solid #f1c40f; }
        .offer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .offer-product { font-weight: bold; color: #fff; }
        .offer-price { color: #2ecc71; font-weight: bold; font-size: 1.1em; }
        .offer-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #95a5a6; }
        .vote-btn-group { display: flex; gap: 8px; }
        .vote-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 13px; font-weight: bold; }
        .vote-btn:hover { background: rgba(255,255,255,0.2); }
        .vote-btn:active { transform: scale(0.9); }
        .waze-btn { background: #e67e22; color: #fff; border: none; padding: 15px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .waze-btn:active { transform: scale(0.95); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background-color: #2c3e50; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .modal-content h3 { margin-top: 0; color: #f1c40f; text-align: center; }
        .modal-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #34495e; border-radius: 8px; background: rgba(0,0,0,0.2); color: #fff; box-sizing: border-box; }
        .modal-btn-group { display: flex; gap: 10px; }
        .modal-btn-group button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #7f8c8d; color: white; }
        .btn-submit { background: #e67e22; color: white; }
    </style>
</head>
<body class="scrollable">

    <a href="index.html" class="back-btn-float">⬅ Voltar ao Mapa</a>
    <a id="promo-website-btn" href="#" class="website-btn-float hidden">🌐 Site</a>

    <div class="promo-page-container">
        <div class="promo-header">
            <div class="promo-logo-wrapper">
                <img id="promo-logo" src="" alt="Logo">
            </div>
            <div class="hours-container">
                <span id="promo-open-status" class="open-status"></span>
                <div id="promo-hours" class="promo-hours"></div>
            </div>
            <h1 id="promo-title">Carregando...</h1>
            <div id="promo-status-badge" class="status-badge">...</div>
        </div>

        <div class="promo-content">
            <div class="promo-card">
                <h2>📢 Radar da Comunidade</h2>
                <div id="offers-container" class="offers-list">
                    <p class="highlight-text" style="text-align:center;">Carregando achados da galera...</p>
                </div>
                
                <button class="waze-btn" onclick="openModal()">📍 Reportar Achado Aqui</button>
            </div>

            <div class="action-buttons">
                <a id="btn-maps" href="#" target="_blank" class="primary-btn">🚗 Como Chegar</a>
                <button onclick="sharePromo()" class="secondary-btn">📲 Compartilhar Local</button>
            </div>
        </div>
    </div>

    <!-- Modal de Contribuição -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>📍 Reportar Promoção</h3>
            <p style="color: #bdc3c7; font-size: 13px; text-align: center; margin-bottom: 20px;">Viu algo barato? Avise a cidade!</p>
            
            <input type="text" id="report-product" class="modal-input" placeholder="Produto (Aceita digitação livre)" maxlength="50" list="produtos-sugeridos">
            <datalist id="produtos-sugeridos">
                <option value="🍚 Arroz Branco 5kg"></option>
                <option value="🫘 Feijão Carioca 1kg"></option>
                <option value="🛢️ Óleo de Soja 900ml"></option>
                <option value="☕ Café Torrado 500g"></option>
                <option value="🥛 Leite Integral 1L"></option>
                <option value="🥩 Contra Filé (kg)"></option>
                <option value="🥩 Alcatra (kg)"></option>
                <option value="🍗 Peito de Frango (kg)"></option>
                <option value="🍗 Coxa e Sobrecoxa (kg)"></option>
                <option value="🍻 Cerveja Lata 350ml"></option>
                <option value="🍻 Cerveja Garrafa 600ml"></option>
                <option value="🥤 Refrigerante 2L"></option>
                <option value="🥚 Ovos Brancos (30 un)"></option>
                <option value="🧀 Queijo Mussarela (kg)"></option>
                <option value="🥪 Presunto (kg)"></option>
                <option value="🧈 Margarina 500g"></option>
                <option value="🥖 Pão Francês (kg)"></option>
                <option value="🧼 Sabão em Pó 1kg"></option>
                <option value="🧴 Amaciante 2L"></option>
                <option value="🧻 Papel Higiênico (12 un)"></option>
            </datalist>

            <input type="text" id="report-price" class="modal-input" placeholder="Preço (Ex: R$ 22,90)" maxlength="15">
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-submit" id="btn-submit-report">Enviar Alerta 🚀</button>
            </div>
        </div>
    </div>

    <!-- Browser Interno (IFrame) -->
    <div id="iframe-overlay" class="hidden">
        <div class="iframe-header">
            <button onclick="closeIframe()" class="iframe-close-btn">✖ Voltar à DIVE</button>
            <span id="iframe-title">Carregando Site...</span>
        </div>
        <iframe id="promo-iframe" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        let establishmentData = null;

        async function loadData() {
            if (!id) return;
            const docRef = doc(db, "establishments", String(id));
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                establishmentData = docSnap.data();
                renderPage();
            } else {
                document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:50px;'>Local não encontrado.</h1><a href='index.html' style='display:block;text-align:center;color:white;'>Voltar</a>";
            }
        }

        function renderPage() {
            if (!establishmentData.offers) establishmentData.offers = [];
            
            // Fila de Filtro de Válidos
            const nowTime = Date.now();
            const validOffers = establishmentData.offers.filter(o => o.expiresAt > nowTime);

            document.getElementById('promo-title').innerText = establishmentData.name;
            document.getElementById('promo-logo').src = establishmentData.icon || 'https://cdn-icons-png.flaticon.com/512/854/854878.png';
            if (establishmentData.hours) document.getElementById('promo-hours').innerText = establishmentData.hours;

            // Horários
            if (establishmentData.schedule) {
                const now = new Date();
                const day = now.getDay();
                const hour = now.getHours();
                let schedule = establishmentData.schedule.all ? establishmentData.schedule.all : (day === 0 ? establishmentData.schedule.sun : establishmentData.schedule.week);
                const isOpen = (schedule && hour >= schedule[0] && hour < schedule[1]);
                document.getElementById('promo-open-status').innerHTML = isOpen ? '<span class="badge-open">Aberto Agora</span>' : '<span class="badge-closed">Fechado</span>';
            }

            // Matemática Termométrica Visual
            const count = validOffers.length;
            const statusBadge = document.getElementById('promo-status-badge');
            
            if (count >= 5) {
                statusBadge.innerText = `🔥 Muito Movimentado (${count} Ofertas!)`;
                statusBadge.style.backgroundColor = "#e74c3c";
            } else if (count >= 1) {
                statusBadge.innerText = `✨ Movimento Moderado (${count} Ofertas)`;
                statusBadge.style.backgroundColor = "#f39c12"; 
            } else {
                statusBadge.innerText = "🧊 Tranquilo (Nada reportado hoje)";
                statusBadge.style.backgroundColor = "#3498db";
            }

            // Renderizar Lista (Com Metadados Premium)
            const container = document.getElementById('offers-container');
            if (count === 0) {
                container.innerHTML = `<p style="text-align:center; color:#95a5a6; font-style:italic;">Nenhuma promoção ativa na vista da comunidade. Sabe de alguma? Reporte abaixo!</p>`;
            } else {
                // Criação retroativa de IDs se algum item legado tiver sem
                validOffers.forEach(o => { if(!o.id) o.id = o.expiresAt; });
                
                // Sort array so newest is at the top (optional, mas legal para o Waze)
                validOffers.sort((a,b) => b.id - a.id);

                container.innerHTML = validOffers.map(offer => {
                    // Cálculo de Tempo Hábil
                    const createdAt = offer.id || (offer.expiresAt - (4 * 60 * 60 * 1000));
                    const timeDiffMs = Date.now() - createdAt;
                    const mins = Math.floor(timeDiffMs / 60000);
                    
                    let ageText = "Agora mesmo!";
                    if (mins >= 1 && mins < 60) ageText = `Há ${mins} min`;
                    else if (mins >= 60) {
                        const hrs = Math.floor(mins / 60);
                        ageText = `Há ${hrs}h`;
                    }
                    
                    // Contagem de votos garantida
                    const up = offer.up || 0;
                    const down = offer.down || 0;

                    return `
                    <div class="offer-item">
                        <div class="offer-header">
                            <span class="offer-product">${DOMPurify.sanitize(offer.product)}</span>
                            <span class="offer-price">${DOMPurify.sanitize(offer.price)}</span>
                        </div>
                        <div class="offer-meta">
                            <span>⏱️ ${ageText}</span>
                            <div class="vote-btn-group">
                                <button class="vote-btn" onclick="voteOffer(${offer.id}, 'up')" title="Confirmo que está lá">👍 ${up}</button>
                                <button class="vote-btn" onclick="voteOffer(${offer.id}, 'down')" title="Acabou ou Falso">👎 ${down}</button>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }

            document.getElementById('btn-maps').href = `https://www.google.com/maps/dir/?api=1&destination=${establishmentData.coords[0]},${establishmentData.coords[1]}`;
            
            if (establishmentData.website) {
                const siteBtn = document.getElementById('promo-website-btn');
                siteBtn.innerHTML = `🌐 ${establishmentData.name.split(' ')[0]}`;
                siteBtn.classList.remove('hidden');
                siteBtn.onclick = (e) => {
                    e.preventDefault();
                    document.getElementById('iframe-title').innerText = establishmentData.name;
                    document.getElementById('promo-iframe').src = establishmentData.website;
                    document.getElementById('iframe-overlay').classList.remove('hidden');
                };
            }
        }

        // ====== LÓGICA DE AUDITORIA DO WAZE ======
        window.voteOffer = async function(offerId, type) {
            // Escudo Anti-Mutreta (Votar duas vezes na mesma oferta)
            const voteKey = 'dive_voted_' + offerId;
            if (localStorage.getItem(voteKey)) {
                alert("Calma! Você já deixou seu voto para esta oferta.");
                return;
            }
            
            try {
                let currentOffers = establishmentData.offers || [];
                let index = currentOffers.findIndex(o => String(o.id) === String(offerId));
                if (index === -1) return;

                let offer = currentOffers[index];
                if (type === 'up') offer.up = (offer.up || 0) + 1;
                else if (type === 'down') offer.down = (offer.down || 0) + 1;

                // Auditoria da Comunidade: Mais de 3 deslikes apaga da face da terra
                let shouldReload = true;
                if (offer.down >= 3) {
                    currentOffers.splice(index, 1);
                    alert("A comunidade decidiu: Essa oferta foi derrubada por falsidade ou expiração! 💥");
                } else {
                    // Sem alerta na votação comum para não encher o saco
                    shouldReload = false;
                }
                
                // Grava que o zé votou (Se der erro network, não grava)
                localStorage.setItem(voteKey, "true");

                // Atualiza Firestore
                const docRef = doc(db, "establishments", String(id));
                await updateDoc(docRef, { offers: currentOffers });
                
                if(shouldReload) window.location.reload();
                else {
                    // Atualiza suavemente a view local para evitar piscar toda a tela
                    establishmentData.offers = currentOffers;
                    renderPage();
                }

            } catch (err) {
                console.error("Erro no voto", err);
                localStorage.removeItem(voteKey); // Devolve o voto
            }
        };


        // ====== LÓGICA DE REPORT WAZE ======
        document.getElementById('btn-submit-report').addEventListener('click', async () => {
            if(!id) return;
            
            // ESCUDO ANTI SPAM (Fadiga de 60 segundos)
            const lastPost = localStorage.getItem('dive_last_post');
            if (lastPost && (Date.now() - parseInt(lastPost)) < 60000) {
                alert("🚨 Você está muito rápido! Por favor, aguarde 1 minuto para reportar outra oferta. Deixe um pouco para os outros!");
                return;
            }

            const product = document.getElementById('report-product').value.trim().slice(0, 50);
            const price = document.getElementById('report-price').value.trim().slice(0, 15);
            
            if (!product || !price) {
                alert("Preencha o Produto e o Preço para avisar a cidade!");
                return;
            }

            const btn = document.getElementById('btn-submit-report');
            btn.innerText = "Enviando... 🚀";
            btn.disabled = true;

            try {
                const newOffer = {
                    id: Date.now(), // ID Universal
                    product: product,
                    price: price,
                    up: 0,
                    down: 0,
                    expiresAt: Date.now() + (4 * 60 * 60 * 1000) // 4 horas de vida
                };

                const docRef = doc(db, "establishments", String(id));
                
                // Filtramos ativos e puxamos arrayLimpo
                let currentOffers = establishmentData.offers || [];
                const validOffers = currentOffers.filter(o => o.expiresAt > Date.now());
                validOffers.push(newOffer);
                const count = validOffers.length;
                
                // Calcula cor imediata Backend
                let newStatus = 'chill';
                let newColor = '#3498db';
                if (count >= 5) { newStatus = 'fire'; newColor = 'red'; }
                else if (count >= 1) { newStatus = 'live'; newColor = '#f1c40f'; }

                await updateDoc(docRef, {
                    offers: validOffers,
                    status: newStatus,
                    color: newColor,
                    updatedAt: new Date().toISOString()
                });

                // Carimba no sistema local da pessoa para bloquear Flood
                localStorage.setItem('dive_last_post', Date.now());

                alert("🎉 Obrigado! O mapa global acaba de ser atualizado!");
                window.location.reload();

            } catch (err) {
                alert("❌ Erro de conexão.");
                btn.innerText = "Enviar Alerta 🚀";
                btn.disabled = false;
            }
        });

        window.openModal = function() { document.getElementById('report-modal').style.display = 'flex'; }
        window.closeModal = function() { document.getElementById('report-modal').style.display = 'none'; }
        
        window.sharePromo = function() {
            const text = `Confira as ofertas da comunidade para o mercado *${establishmentData.name}* no DIVE app! Mapeado ao vivo!`;
            if (navigator.share) navigator.share({ title: 'DIVE Promo', text: text, url: window.location.href });
            else alert("Copie o link no navegador para compartilhar!");
        }

        window.closeIframe = function() {
            document.getElementById('iframe-overlay').classList.add('hidden');
            document.getElementById('promo-iframe').src = "";
        }

        loadData();
    </script>
</body>
</html>

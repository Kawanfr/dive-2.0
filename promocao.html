<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>Ofertas do Dia - DIVE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca de Blindagem Anti-Hacker (DOMPurify) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body class="scrollable">

    <!-- Botão de Voltar Flutuante -->
    <a href="index.html" class="back-btn-float">⬅ Voltar ao Mapa</a>
    
    <!-- Botão de Site Flutuante -->
    <a id="promo-website-btn" href="#" class="website-btn-float hidden">🌐 Site</a>
    


    <div class="promo-page-container">
        <!-- Cabeçalho com Logo e Status -->
        <div class="promo-header">
            <div class="promo-logo-wrapper">
                <img id="promo-logo" src="" alt="Logo do Estabelecimento">
            </div>
            <div class="hours-container">
                <span id="promo-open-status" class="open-status"></span>
                <div id="promo-hours" class="promo-hours"></div>
            </div>
            <h1 id="promo-title">Carregando...</h1>
            <div id="promo-status-badge" class="status-badge">...</div>
        </div>

        <!-- Conteúdo da Promoção -->
        <div class="promo-content">
            <div class="promo-card">
                <h2>📢 Destaque de Agora</h2>
                <p id="promo-msg" class="highlight-text">Nenhuma promoção ativa no momento.</p>
                <div class="promo-footer">
                    <small>Atualizado recentemente</small>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <a id="btn-maps" href="#" target="_blank" class="primary-btn">🚗 Como Chegar</a>
                <button onclick="sharePromo()" class="secondary-btn">📲 Compartilhar Oferta</button>
            </div>
        </div>
    </div>


    <!-- Browser Interno (IFrame) -->
    <div id="iframe-overlay" class="hidden">
        <div class="iframe-header">
            <button onclick="closeIframe()" class="iframe-close-btn">✖ Voltar à DIVE</button>
            <span id="iframe-title">Carregando Site...</span>
        </div>
        <iframe id="promo-iframe" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        // Lógica para carregar os dados da página
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        let establishmentData = null;
        if (id) {
            try {
                const docRef = doc(db, "establishments", String(id));
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    establishmentData = docSnap.data();
                }
            } catch (err) {
                console.error("Erro importando Firebase:", err);
            }
        }

        if (establishmentData) {
            if (establishmentData.expiresAt && Date.now() > establishmentData.expiresAt && establishmentData.status !== 'chill') {
                establishmentData.status = 'chill';
                
                const expiredMessages = [
                    "🏃‍♂️ Ops! Essa promoção acabou de voar da prateleira. Fique de olho na próxima vez!",
                    "⏰ O tempo virou! Essa oferta infelizmente expirou, mas os donos costumam colocar coisas novas rápido.",
                    "⏳ Poxa, você chegou um pouquinho tarde... Quem chega cedo bebe água limpa! Cheque amanhã.",
                    "😕 Essa oferta não é mais válida. Mas não desanime, o mapa tem outras lojas fervendo agora mesmo!",
                    "❌ Fim de papo para este desconto. Retorne depois ou explore locais agitados por perto."
                ];
                
                // Exibe uma mensagem randômica (sorteio) da lista acima
                establishmentData.msg = expiredMessages[Math.floor(Math.random() * expiredMessages.length)];
            }

            // Preenche a UI
            document.getElementById('promo-title').innerText = establishmentData.name;
            document.getElementById('promo-logo').src = establishmentData.icon || 'https://cdn-icons-png.flaticon.com/512/854/854878.png';
            
            // Preenche o Horário
            if (establishmentData.hours) document.getElementById('promo-hours').innerText = establishmentData.hours;

            // --- Lógica de Aberto/Fechado ---
            if (establishmentData.schedule) {
                const now = new Date();
                const day = now.getDay(); // 0 = Domingo, 1-6 = Seg-Sáb
                const hour = now.getHours();
                let isOpen = false;
                let schedule = null;

                // Define qual horário usar
                if (establishmentData.schedule.all) {
                    schedule = establishmentData.schedule.all;
                } else {
                    schedule = (day === 0) ? establishmentData.schedule.sun : establishmentData.schedule.week;
                }

                // Verifica se está dentro do horário
                if (schedule && hour >= schedule[0] && hour < schedule[1]) {
                    isOpen = true;
                }

                const statusSpan = document.getElementById('promo-open-status');
                if (isOpen) {
                    statusSpan.innerHTML = '<span class="badge-open">Aberto Agora</span>';
                } else {
                    statusSpan.innerHTML = '<span class="badge-closed">Fechado</span>';
                }
            }
            
            // Define Status (Prioridade única)
            const currentStatus = establishmentData.status;
            const statusBadge = document.getElementById('promo-status-badge');
            
            if (currentStatus === 'fire') {
                statusBadge.innerText = "🔥 Muito Movimentado (Promoções Ativas)";
                statusBadge.style.backgroundColor = "#e74c3c";
            } else if (currentStatus === 'chill') {
                statusBadge.innerText = "🧊 Tranquilo (Poucas filas)";
                statusBadge.style.backgroundColor = "#3498db";
            } else {
                statusBadge.innerText = "🎤 Ao Vivo / Evento";
                statusBadge.style.backgroundColor = "#f1c40f";
                statusBadge.style.color = "#333";
            }

            // Define Mensagem Sanitizada Contra XSS
            const msg = establishmentData.msg;
            if (msg) document.getElementById('promo-msg').innerHTML = DOMPurify.sanitize(msg);

            // Link do Maps
            document.getElementById('btn-maps').href = `https://www.google.com/maps/dir/?api=1&destination=${establishmentData.coords[0]},${establishmentData.coords[1]}`;
            
            // Exibe o botão do Site ativando o navegador interno (Iframe)
            if (establishmentData.website) {
                const siteBtn = document.getElementById('promo-website-btn');
                siteBtn.innerHTML = `🌐 ${establishmentData.name.split(' ')[0]}`;
                siteBtn.classList.remove('hidden');
                
                // Intercepta o clique para abrir o Iframe em vez de outra aba
                siteBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('iframe-title').innerText = establishmentData.name;
                    document.getElementById('promo-iframe').src = establishmentData.website;
                    document.getElementById('iframe-overlay').classList.remove('hidden');
                });
            }
        } else {
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:50px;'>Estabelecimento não encontrado.</h1><a href='index.html' style='display:block;text-align:center;color:white;'>Voltar</a>";
        }

        window.sharePromo = function() {
            const text = `Confira as ofertas de *${establishmentData.name}* no DIVE app! \n\n${document.getElementById('promo-msg').innerText}`;
            if (navigator.share) navigator.share({ title: 'DIVE Promo', text: text, url: window.location.href });
            else alert("Copie o link para compartilhar!");
        }

        window.closeIframe = function() {
            document.getElementById('iframe-overlay').classList.add('hidden');
            document.getElementById('promo-iframe').src = ""; // Limpa a memória do navegador
        }

        // --- EFEITO DE CONFETE ---
        function startConfetti() {
            const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Propriedades Aleatórias
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; // Entre 2s e 4s
                confetti.style.opacity = Math.random();
                
                document.body.appendChild(confetti);

                // Remove do DOM após a animação para não pesar
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        // Inicia a festa ao carregar
        startConfetti();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial=scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>Dive Business - Área do Parceiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="scrollable">

    <div class="admin-container">
        <div class="admin-header">
            <h1>Dive Business 💼</h1>
            <p>Gerencie seu estabelecimento em tempo real.</p>
        </div>

        <form id="business-form">
            <div class="form-group">
                <label>Selecione seu Estabelecimento</label>
                <select id="place-select"></select>
            </div>

            <div class="form-group">
                <label>Status Agora</label>
                <select id="place-status">
                    <option value="fire">🔥 Agitado (Lotado)</option>
                    <option value="chill">🧊 Vazio (Compras tranquilas)</option>
                    <option value="live">🎤 Muitas promoções</option>
                </select>
            </div>

            <div class="promo-card" style="margin-top: 20px; border: 2px solid #8e44ad;">
    <h3 style="color: #8e44ad; margin-top: 0;">🤖 Assistente IA (Gemini)</h3>
    <p style="font-size: 13px; color: #555;">Crie locais instantaneamente informando o nome e a cidade. A IA buscará as coordenadas e informações.</p>
    
    <div class="form-group">
        <label>Chave da API do Google Gemini:</label>
        <input type="text" id="ai-api-key" placeholder="Cole sua API Key aqui..." style="font-size: 12px;">
        <small><a href="https://aistudio.google.com/app/apikey" target="_blank">Pegue sua chave gratuita aqui</a></small>
    </div>

    <div class="form-group">
        <label>O que deseja adicionar?</label>
        <textarea id="ai-prompt" rows="3" placeholder="Ex: Adicione o supermercado Pão de Açúcar da Avenida Paulista, São Paulo"></textarea>
    </div>

    <button id="ai-btn" type="button" class="primary-btn" style="background-color: #8e44ad;" onclick="addPlaceWithAI()">✨ Gerar e Adicionar ao Mapa</button>
    <button type="button" class="secondary-btn" style="margin-top: 10px; background-color: #e74c3c;" onclick="clearAIPlaces()">🗑️ Limpar Locais da IA</button>
</div>


            <div class="form-group">
                <label>Mensagem / Promoção</label>
                <textarea id="place-msg" rows="3" placeholder="Ex: Rodada dupla de Chopp até as 20h!"></textarea>
            </div>

            <button type="submit" class="primary-btn">🚀 Atualizar Status</button>
        </form>
    </div>

    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial=scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>Dive Business - Área do Parceiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="scrollable">

    <div class="admin-container">
        <div class="admin-header">
            <h1>Dive Business 💼</h1>
            <p>Gerencie seu estabelecimento em tempo real.</p>
        </div>

        <form id="business-form">
            <div class="form-group">
                <label>Selecione seu Estabelecimento</label>
                <select id="place-select"></select>
            </div>

            <div class="form-group">
                <label>Status Agora</label>
                <select id="place-status">
                    <option value="fire">🔥 Agitado (Lotado)</option>
                    <option value="chill">🧊 Vazio (Compras tranquilas)</option>
                    <option value="live">🎤 Muitas promoções</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mensagem / Promoção</label>
                <textarea id="place-msg" rows="3" placeholder="Ex: Rodada dupla de Chopp até as 20h!"></textarea>
            </div>

            <button type="submit" class="primary-btn">🚀 Atualizar Status</button>
        </form>
    </div>


    <script type="module" src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="scrollable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <title>DIVE Fortress - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        .login-box h1 { margin-bottom: 5px; color: #fff; }
        .login-box p { color: #bdc3c7; margin-bottom: 25px; }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #34495e;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            box-sizing: border-box;
        }
        .auth-input:focus { border-color: #3498db; outline: none; }
        .btn-lock { width: 100%; font-size: 16px; padding: 12px; }
    </style>
</head>
<body class="scrollable" style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center;">

    <div class="login-box">
        <h1>DIVE 🏰</h1>
        <p>Acesso Restrito: Identifique-se para gerenciar o Master.</p>
        
        <form id="login-form">
            <input type="email" id="email" class="auth-input" placeholder="Email (admin@dive.com)" required>
            <input type="password" id="password" class="auth-input" placeholder="Sua Senha" required>
            
            <button type="submit" class="primary-btn btn-lock" id="login-btn">🔓 Entrar no Sistema</button>
            <br><br>
            <a href="index.html" style="color: #3498db; text-decoration: none; font-size: 13px;">🗺️ Voltar ao Mapa Público</a>
        </form>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
